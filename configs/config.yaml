# Base configuration. Compose with:  python scripts/train.py model=convnext_tiny train.lr=1e-4
defaults:
  - data: ham10000
  - model: effnetv2_s

seed: 1337
deterministic: true
experiment: null            # name of a file in configs/experiment/ (optional)

paths:
  data_dir: data/ham10000
  output_dir: artifacts
  mlflow_uri: file:./mlruns

train:
  loss: focal               # ce | focal
  focal_gamma: 2.0
  label_smoothing: 0.05
  lr: 3.0e-4
  weight_decay: 0.05
  head_lr_mult: 10.0
  scheduler: cosine         # cosine | none
  warmup_frac: 0.05
  max_epochs: 40
  precision: 16-mixed       # 32-true on CPU
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  early_stop_patience: 8
  monitor: val/auroc
  monitor_mode: max
  ema:
    enabled: true
    decay: 0.9998
    warmup_steps: 2000
  mixup:
    enabled: true
    mixup_alpha: 0.2
    cutmix_alpha: 1.0
    prob: 0.5
    switch_prob: 0.5

trainer:
  devices: auto
  accelerator: auto
  log_every_n_steps: 20
  num_sanity_val_steps: 2
